[package]
name = "shredder"
version = "0.1.0"
description = "把文件拖进屏幕边缘的碎纸机，放进系统回收站"
edition = "2021"

[lib]
name = "shredder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# 锁在 2.11：2.12 起要求 Rust 1.90，这台机器是 1.87。
tauri = { version = "=2.11.6", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
notify = "=6.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
